# Example CUI NiFi Extensions Configuration in YAML format
#
# THIS FILE IS THE COMPLETE CONSUMED CONFIGURATION SURFACE.
# Every key below is actually read: the global keys by ConfigurationManager (which flattens
# YAML into dotted property keys) and the per-issuer keys by IssuerConfigurationParser.
# Any key that does NOT appear here is NOT read by the extensions - adding one has no effect.
#
# "issuer" is MANDATORY for every entry of the issuers list. It is the issuer identity and
# must equal the "iss" claim of the tokens that IdP issues; an entry without it is skipped.

# --- Global JWT validation settings ---------------------------------------------------------
# Written as flat, dotted keys - exactly the property names the parser looks up.

# Signing algorithms accepted for token validation.
jwt.validation.allowed.algorithms:
  - RS256
  - RS384
  - RS512
  - ES256

# Maximum accepted token size in bytes.
jwt.validation.maximum.token.size: 16384

# Reject JWKS URLs that are not HTTPS. Default: true.
jwt.validation.require.https.for.jwks: true

# Allow JWKS URLs that resolve to loopback or private network addresses.
# This is the explicit SSRF opt-in for an IdP on an internal network. Default: false.
jwt.validation.jwks.allow.private.network.addresses: false

# Interval in seconds between JWKS key refreshes.
jwt.validation.jwks.refresh.interval: 3600

# Connection timeout in seconds for JWKS endpoints.
jwt.validation.jwks.connection.timeout: 10

# --- Trusted issuers ------------------------------------------------------------------------
# Consumed per-entry keys: id, issuer, jwks-url, jwks-file, jwks-type, audience,
# client-id, enabled.
issuers:
  # Example 1: Google OAuth2 - JWKS served from a URL
  - id: google
    issuer: https://accounts.google.com
    jwks-url: https://www.googleapis.com/oauth2/v3/certs
    jwks-type: url
    audience: your-client-id.apps.googleusercontent.com
    enabled: true

  # Example 2: Auth0 - JWKS served from a URL, with an expected client id
  - id: auth0
    issuer: https://your-tenant.auth0.com/
    jwks-url: https://your-tenant.auth0.com/.well-known/jwks.json
    jwks-type: url
    audience: https://your-api.example.com
    client-id: your-auth0-client-id
    enabled: true

  # Example 3: Keycloak - JWKS read from a local file
  - id: keycloak
    issuer: https://keycloak.example.com/realms/your-realm
    jwks-file: /opt/nifi/conf/keycloak-jwks.json
    jwks-type: file
    audience: your-client
    enabled: true
